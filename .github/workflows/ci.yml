name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "arena/**", "feature/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    # Isolated, disposable PostgreSQL for real migration and RLS integration tests.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: campusconnect_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d campusconnect_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/campusconnect_ci?schema=public
      TEST_ADMIN_DATABASE_URL: postgresql://ci:ci@localhost:5432/campusconnect_ci?schema=public
      TEST_RUNTIME_DATABASE_URL: postgresql://campusconnect_runtime:ci-only@localhost:5432/campusconnect_ci?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies (lockfile)
        run: npm ci --no-fund
      - name: Record dependency audit
        shell: bash
        run: |
          audit_status=0
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || audit_status=$?
          # Vulnerabilities make npm audit exit 1; registry/report failures must
          # still fail CI. Findings are visible, not a vulnerability-free gate.
          node - "$RUNNER_TEMP/npm-audit.json" "$audit_status" <<'NODE'
          const fs = require('node:fs');
          const r = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const status = Number(process.argv[3]);
          if (!r.metadata?.vulnerabilities || r.error || (status !== 0 && status !== 1)) process.exit(1);
          const v = r.metadata.vulnerabilities;
          if ((status === 0) !== (v.total === 0)) process.exit(1);
          console.log(`::warning title=npm audit::${v.total} total: ${v.critical} critical, ${v.high} high, ${v.moderate} moderate, ${v.low} low`);
          NODE
      - name: Upload dependency audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: ${{ runner.temp }}/npm-audit.json
          if-no-files-found: error
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Apply migrations and provision restricted test role
        env:
          PGPASSWORD: ci
        run: |
          psql -h localhost -U ci -d campusconnect_ci -v ON_ERROR_STOP=1 -f prisma/admin/create-runtime-role.sql
          # Idempotent while NOLOGIN; assert pre-migration role state in the disposable DB.
          psql -h localhost -U ci -d campusconnect_ci -v ON_ERROR_STOP=1 -f prisma/admin/create-runtime-role.sql
          test "$(psql -h localhost -U ci -d campusconnect_ci -At -v ON_ERROR_STOP=1 -c "SELECT rolcanlogin OR rolsuper OR rolbypassrls OR rolcreatedb OR rolcreaterole OR rolreplication FROM pg_roles WHERE rolname = 'campusconnect_runtime'")" = f
          npx prisma migrate deploy
          psql -h localhost -U ci -d campusconnect_ci -v ON_ERROR_STOP=1 -f prisma/admin/runtime-role.sql
          psql -h localhost -U ci -d campusconnect_ci -v ON_ERROR_STOP=1 -c "ALTER ROLE campusconnect_runtime LOGIN PASSWORD 'ci-only'"
      - name: PostgreSQL RLS integration tests
        run: npm run test:integration -- --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/tenant-tests.json"
      - name: Report PostgreSQL test counts
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/tenant-tests.json" ]; then
            node -e 'const r=require(process.argv[1]); console.log(`::notice title=PostgreSQL integration tests::${r.numPassedTests} passed, ${r.numFailedTests} failed, ${r.numPendingTests} pending, ${r.numTotalTests} total`)' "$RUNNER_TEMP/tenant-tests.json"
          fi
      - name: Set up isolated authentication proof (disposable DB only)
        env:
          PGPASSWORD: ci
        run: psql -h localhost -U ci -d campusconnect_ci -v ON_ERROR_STOP=1 -f experiments/auth-boundary/setup.sql
      - name: Authentication boundary proof tests
        run: npm run test:auth-poc -- --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/auth-poc-tests.json"
      - name: Report authentication proof counts
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/auth-poc-tests.json" ]; then
            node -e 'const r=require(process.argv[1]); console.log(`::notice title=Authentication proof tests::${r.numPassedTests} passed, ${r.numFailedTests} failed, ${r.numPendingTests} pending, ${r.numTotalTests} total`)' "$RUNNER_TEMP/auth-poc-tests.json"
          fi
      - name: Lint
        run: npm run lint
      - name: TypeScript typecheck (strict)
        run: npm run typecheck
      - name: Unit tests (Vitest)
        run: npm test
      - name: Production build
        run: npm run build
      # Playwright e2e is intentionally NOT run in CI yet: it needs a seeded
      # database and browser install; documented as unverified until wired up.
